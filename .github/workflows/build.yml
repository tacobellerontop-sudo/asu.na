name: Build and publish

# Every push and pull request: test the launcher detection on all three OSes and build the app.
# Pushing a version tag (v1.2.3) also publishes the builds as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: >-
    libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libfontconfig1-dev libfreetype-dev libvulkan-dev libssl-dev pkg-config

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      # The core crate has no GUI dependencies, so this is quick on every OS.
      - run: cargo test -p asuna-core --locked

  package:
    name: package (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-${{ matrix.name }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      # Tagged builds take their version from the tag, so v1.2.3 produces 1.2.3.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i.bak "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml && rm Cargo.toml.bak
          grep -m1 '^version' Cargo.toml

      - name: Build
        run: cargo build --release -p asuna-app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/asuna.exe dist/AsuNa.exe
          Compress-Archive -Path dist/AsuNa.exe -DestinationPath dist/AsuNa-Launcher-windows-x64.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle --locked
          cargo bundle --release -p asuna-app
          mkdir -p dist
          ditto -c -k --keepParent "target/release/bundle/osx/AsuNa Launcher.app" dist/AsuNa-Launcher-macos-arm64.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/asuna
          cp target/release/asuna dist/asuna/
          cp README.md dist/asuna/
          tar -C dist -czf dist/AsuNa-Launcher-linux-x64.tar.gz asuna

      - uses: actions/upload-artifact@v4
        with:
          name: asuna-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/AsuNa.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/AsuNa.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

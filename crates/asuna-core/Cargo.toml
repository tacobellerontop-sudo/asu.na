[package]
name = "asuna-core"
description = "Launcher detection, library and launching for AsuNa (no GUI)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = "2"
dirs = "5"
open = "5"
auto-launch = "0.5"
log = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
